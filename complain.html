<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RGC AI Assistant | Railway Grievance Registration</title>
  <meta name="description" content="AI-Powered Railway Grievance Chatbot for Instant Complaint Registration & PNR Tracking.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-viewport">
    <!-- Main Glassmorphism Card Container -->
    <main class="glass-card">
      
      <!-- Top Navigation & Header -->
      <header class="card-header">
        <div class="top-bar-controls">
          <!-- Left: Navigation Menu Toggle -->
          <button class="icon-btn" id="menu-toggle-btn" aria-label="Open Navigation Menu" title="Menu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>

          <!-- Navigation Dropdown Drawer -->
          <nav class="nav-menu-dropdown" id="nav-menu-dropdown">
            <a href="complain.html" class="nav-menu-item active">
              <span>💬</span> Register Complaint
            </a>
            <a href="track.html" class="nav-menu-item">
              <span>📢</span> Track Complaint Status
            </a>
            <a href="tel:139" class="nav-menu-item">
              <span>📞</span> Railway Helpline 139
            </a>
            <a href="#" onclick="showToast('Security & Data Encrypted by Indian Railways'); return false;" class="nav-menu-item">
              <span>🛡️</span> Privacy & Safety
            </a>
          </nav>

          <!-- Right: Language Switcher -->
          <div class="language-selector">
            <button class="lang-btn" id="lang-btn" aria-label="Select Language">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
              <span id="current-lang-label">English</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>

            <!-- Language Dropdown -->
            <div class="lang-dropdown" id="lang-dropdown">
              <div class="lang-option" data-lang="en">English</div>
              <div class="lang-option" data-lang="hi">हिन्दी (Hindi)</div>
              <div class="lang-option" data-lang="bn">বাংলা (Bengali)</div>
              <div class="lang-option" data-lang="ta">தமிழ் (Tamil)</div>
              <div class="lang-option" data-lang="mr">मराठी (Marathi)</div>
            </div>
          </div>
        </div>

        <!-- Center Brand Emblem -->
        <div class="brand-badge" title="RGC Railway Grievance System">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2c-4 0-8 .5-8 4v9.5C4 17.43 5.57 19 7.5 19L6 20.5v.5h12v-.5L16.5 19c1.93 0 3.5-1.57 3.5-3.5V6c0-3.5-4-4-8-4zm0 2c3.71 0 5.82.42 6 2H6c.18-1.58 2.29-2 6-2zm-5 6c.83 0 1.5.67 1.5 1.5S7.83 13 7 13s-1.5-.67-1.5-1.5S6.17 10 7 10zm10 3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm-5 3.5c-2.76 0-5-.67-5-1.5h10c0 .83-2.24 1.5-5 1.5z"/>
          </svg>
        </div>
        
        <h1 class="brand-title">RGC AI Assistant</h1>
        <p class="brand-subtitle">Railway Grievance Chatbot</p>
        <div class="header-accent-line"></div>
      </header>

      <!-- Chat Conversation View Area -->
      <section class="chat-container" id="chat-container" aria-label="Chat Conversation">
        <!-- Interactive 8-Step Flow dynamically loaded by js/chat.js -->
      </section>

      <!-- Bottom Quick Navigation Action Bar -->
      <footer class="bottom-nav">
        <a href="complain.html" class="nav-item active">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
          </div>
          <span class="nav-label">Register Complaint</span>
        </a>

        <a href="track.html" class="nav-item">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
              <path d="M18 10a6 6 0 1 0-12 0"></path>
            </svg>
          </div>
          <span class="nav-label">Track Status</span>
        </a>

        <a href="#" onclick="showToast('🔒 All grievance data is encrypted & secured under Railway Board Guidelines'); return false;" class="nav-item">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
          </div>
          <span class="nav-label">Secure & Private</span>
        </a>

        <a href="tel:139" class="nav-item">
          <div class="nav-icon">
            <svg viewBox="0 0 24 24">
              <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
              <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
            </svg>
          </div>
          <span class="nav-label">24x7 Support</span>
        </a>
      </footer>

    </main>
  </div>

  <!-- JavaScript Scripts -->
  <script src="js/app.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
